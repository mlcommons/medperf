# Both tasks call the same workflow executable. The default flow prepares data;
# statistics starts at validation (sanity_check) and also generates statistics.
# Mount paths follow the /workspace layout the reused stages expect.
container_type: DockerImage
image: mlcommons/hemnet-prep-workflow:0.1.0
tasks:
  prepare:
    run_args:
      command: python3 -m prep_workflow.main
    input_volumes:
      data_path:
        mount_path: /workspace/input_data
        type: directory
      labels_path:
        mount_path: /workspace/input_labels
        type: directory
      parameters_file:
        mount_path: /workspace/parameters.yaml
        type: file
      additional_files:
        mount_path: /workspace/additional_files
        type: directory
    output_volumes:
      output_path:
        mount_path: /workspace/data
        type: directory
      output_labels_path:
        mount_path: /workspace/labels
        type: directory
      report_file:
        mount_path: /workspace/report.yaml
        type: file
  statistics:
    run_args:
      command: python3 -m prep_workflow.main --start=sanity_check
    input_volumes:
      data_path:
        mount_path: /workspace/data
        type: directory
      labels_path:
        mount_path: /workspace/labels
        type: directory
      parameters_file:
        mount_path: /workspace/parameters.yaml
        type: file
    output_volumes:
      output_path:
        mount_path: /workspace/statistics.yaml
        type: file
