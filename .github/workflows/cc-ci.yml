name: Confidential computing tests workflow

on: pull_request

jobs:
  setup:
    name: confidential-computing-tests
    runs-on: ubuntu-latest
    strategy:
      # Who operates the execution. Anybody may -- what the policies decide is
      # who collects, and both scenarios release results to the data owner. So
      # the modelowner row is the one where the operator never sees what the
      # workload produced, and the collection step is a second party's.
      fail-fast: false
      matrix:
        operator: [dataowner, modelowner]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -r cli/test-requirements.txt
          pip install -r server/requirements.txt
          pip install -r server/test-requirements.txt
          pip install -e cc/
          pip install -e cli/


      - name: Set server environment vars
        working-directory: ./server
        run: cp .env.local.local-auth .env

      - name: Run postgresql server in background
        working-directory: ./server
        run: sh run_dev_postgresql.sh && sleep 6

      - name: Run django server in background with generated certs
        working-directory: ./server
        run: sh setup-dev-server.sh & sleep 6

      # Deliberately no seed step, unlike the other client workflows. seed.py
      # registers the chestxray tutorial's prep container, and a container is
      # unique on (image_hash, additional files hash, config, parameters) -- so
      # this test submitting the same one is rejected. It builds every entity
      # it needs anyway, and the CA it takes certificates from comes from a
      # migration rather than from the seed.

      - name: Run client integration tests
        working-directory: .
        env:
          CC_OPERATOR: ${{ matrix.operator }}
        run: sh cli/cli_tests_cc.sh -f
