name: Auth Integration workflow

on: pull_request_target

jobs:
  authorize:
    environment:
      'testing-external-code'
    runs-on: ubuntu-latest
    steps:
      - run: true
  setup:
    needs: authorize
    name: auth-integration-test
    runs-on: ubuntu-latest
    env:
      MOCK_USERS_PASSWORD: ${{ secrets.MEDPERF_MOCK_USERS_PASSWORD }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: .
      run: |
        python -m pip install --upgrade pip
        pip install -r server/requirements.txt -r server/test-requirements.txt
        pip install -e "./cli[dev]"

    - name: Set server config and start postgresql
      working-directory: ./server
      run: python -m medperf_server set_config online-auth

    - name: Run django server in background with generated certs
      working-directory: ./server
      run: |
        python -m medperf_server start &
        timeout 120 bash -c 'until curl -ksf https://127.0.0.1:8000/version >/dev/null; do sleep 2; done'

    - name: Run server integration tests
      working-directory: ./server
      run: python -m medperf_server seed --cert cert.crt --auth online

    - name: Run client integration tests
      working-directory: .
      run: sh cli/auth_tests.sh -f
