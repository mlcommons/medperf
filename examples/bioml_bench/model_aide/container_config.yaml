container_type: DockerImage
image: mhmdk0/bioml-bench-aide:0.0.2
tasks:
  infer:
    run_args:
      # the LLM needs a GPU. Docker only: vLLM's shared memory
      gpus: all
      shm_size: 16gb
    input_volumes:
      data_path:
        mount_path: /mlcommons/volumes/data
        type: directory
      parameters_file:
        mount_path: /mlcommons/volumes/parameters/parameters_file.yaml
        type: file
      additional_files:
        mount_path: /mlcommons/volumes/additional_files
        type: directory
    output_volumes:
      output_path:
        mount_path: /mlcommons/volumes/predictions
        type: directory
