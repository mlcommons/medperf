{# Layout of the entity details pages: a details panel (block detail_panel) with the running task panel. #}
{% extends "base.html" %}

{% block title %}Details{% endblock %}

{% block content %}
<div class="detail-container w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="detail-panel w-full">
        {% block detail_panel %}{% endblock %}
    </div>
</div>
{% endblock %}
