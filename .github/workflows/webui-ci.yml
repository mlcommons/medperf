name: WebUI Integration workflow

on: pull_request

jobs:
  setup:
    name: webui-integration-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      working-directory: .
      run: |
        python -m pip install --upgrade pip
        pip install -r server/requirements.txt -r server/test-requirements.txt
        pip install -e "./cli[dev]"

    - name: Set server config and start postgresql
      working-directory: ./server
      run: python -m medperf_server set_config postgresql

    - name: Run django server in background with generated certs
      working-directory: ./server
      run: |
        python -m medperf_server start &
        timeout 120 bash -c 'until curl -ksf https://127.0.0.1:8000/version >/dev/null; do sleep 2; done'

    - name: Seed database with tutorial data
      working-directory: ./server
      run: python -m medperf_server seed --demo tutorial

    - name: Set up tutorial files
      working-directory: .
      run: bash tutorials_scripts/setup_webui_tutorial.sh

    - name: Run fastapi server in background
      working-directory: .
      run: |
        medperf_webui &
        timeout 120 bash -c 'until curl -s -o /dev/null http://127.0.0.1:8100/; do sleep 2; done'

    - name: Run webUI tutorial E2E tests with pytest
      working-directory: ./cli/medperf/web_ui/tests/e2e/
      run: pytest