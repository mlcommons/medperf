{# Searchable dropdown to pick the benchmark/experiment to associate with. #}
<div class="sticky top-0 z-10 px-3 py-2 border-b border-border bg-card dark:bg-card rounded-t-xl">
    <label class="sr-only">Filter list</label>
    <input
        type="search"
        x-model="listFilter"
        @click.stop
        @keydown.stop
        placeholder="{{ filter_placeholder | default('Filter by name or ID…', true) }}"
        autocomplete="off"
        class="w-full text-sm py-2 px-3 rounded-lg border border-border-strong dark:border-border dark:bg-card-muted dark:text-ink focus:outline-none focus:ring-2 focus:ring-brand-accent/30 focus:border-brand-accent"
    >
</div>
