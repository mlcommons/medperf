name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish-cli:
    name: Build and upload medperf (CLI) to PyPI
    runs-on: ubuntu-latest
    environment: release
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Ensure _version.py was bumped since the last PyPI release
        run: |
          CURRENT_VERSION=$(python -c "import sys; sys.path.insert(0, 'cli'); from medperf._version import __version__; print(__version__)")
          echo "Version in _version.py: $CURRENT_VERSION"

          HTTP_STATUS=$(curl -s -o /tmp/pypi_response.json -w "%{http_code}" https://pypi.org/pypi/medperf/json)

          if [ "$HTTP_STATUS" = "404" ]; then
            echo "medperf is not yet published on PyPI; treating this as the first release."
            exit 0
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Unexpected response from PyPI (HTTP $HTTP_STATUS); aborting."
            exit 1
          fi

          PUBLISHED_VERSION=$(python -c "import json; print(json.load(open('/tmp/pypi_response.json'))['info']['version'])")
          echo "Latest version on PyPI: $PUBLISHED_VERSION"

          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "::error::cli/medperf/_version.py still says $CURRENT_VERSION, which is already published on PyPI. Bump the version before dispatching this workflow."
            exit 1
          fi

      - name: Install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build cli --outdir dist

      - name: Validate artifacts
        run: python -m twine check dist/*

      - name: Publish package via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Defense in depth on top of the version-bump guard above: PyPI
          # rejects re-uploading an existing version with a 400, this turns
          # that specific case into a no-op instead of a failed run.
          skip-existing: true
